<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Planning</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <script>
        let tg = window.Telegram.WebApp;
        // Динамічно завантажуємо темну або світлу тему для календаря
        if (tg.colorScheme === 'dark') {
            document.write('<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">');
        } else {
            document.write('<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">');
        }
    </script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        
        .card {
            width: 100%;
            max-width: 400px;
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--tg-theme-hint-color, #777777);
        }

        input {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border: 1px solid var(--tg-theme-hint-color, #e0e0e0);
            border-radius: 12px;
            background-color: var(--tg-theme-bg-color, #f9f9f9);
            color: var(--tg-theme-text-color, #000000);
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            cursor: pointer;
            -webkit-appearance: none; 
        }

        input:focus {
            border-color: var(--tg-theme-button-color, #3390ec);
            box-shadow: 0 0 0 2px rgba(51, 144, 236, 0.2);
        }

        .btn {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            font-size: 17px;
            font-weight: bold;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📅 Event Planning</h2>
        
        <div class="input-group">
            <label>SELECT DATE</label>
            <input type="text" id="datePicker" placeholder="Tap to select date..." readonly>
        </div>

        <div class="input-group">
            <label>SELECT TIME</label>
            <input type="text" id="timePicker" placeholder="Tap to select time..." readonly>
        </div>

        <button class="btn" id="submit-btn">✅ Save Selection</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    
    <script>
        tg.expand();

        // disableMobile: false вмикає нативні системні барабани на телефонах
        flatpickr("#datePicker", {
            dateFormat: "Y-m-d", 
            minDate: "today",    
            disableMobile: false 
        });

        flatpickr("#timePicker", {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            time_24hr: true,
            disableMobile: false, 
            minuteIncrement: 15
        });

        document.getElementById('submit-btn').addEventListener('click', () => {
            let date = document.getElementById('datePicker').value;
            let time = document.getElementById('timePicker').value;
            
            if(!date || !time) {
                tg.showAlert("Please select both date and time!");
                return;
            }

            tg.sendData(JSON.stringify({ date: date, time: time })); 
        });
    </script>
</body>
</html>
