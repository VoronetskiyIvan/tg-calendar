<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <!-- Забороняємо масштабування, щоб вікно виглядало як нативний додаток -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вибір дати</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Підключаємо стилі Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">
    
    <style>
        body {
            /* Використовуємо системний шрифт пристрою */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        
        .card {
            width: 100%;
            max-width: 400px;
            /* Картка трохи виділяється на фоні для об'єму */
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #777777);
        }

        input {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border: 1px solid var(--tg-theme-hint-color, #e0e0e0);
            border-radius: 12px;
            background-color: var(--tg-theme-bg-color, #f9f9f9);
            color: var(--tg-theme-text-color, #000000);
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        input:focus {
            border-color: var(--tg-theme-button-color, #3390ec);
            box-shadow: 0 0 0 2px rgba(51, 144, 236, 0.2);
        }

        .btn {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            font-size: 17px;
            font-weight: bold;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📅 Планування заходу</h2>
        
        <div class="input-group">
            <label>ОБЕРІТЬ ДАТУ</label>
            <input type="text" id="datePicker" placeholder="Натисніть для вибору дати..." readonly>
        </div>

        <div class="input-group">
            <label>ОБЕРІТЬ ЧАС</label>
            <input type="text" id="timePicker" placeholder="Натисніть для вибору часу..." readonly>
        </div>

        <button class="btn" id="submit-btn">✅ Зберегти вибір</button>
    </div>

    <!-- Підключаємо скрипти Flatpickr та українську локалізацію -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/uk.js"></script>
    
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Налаштування стильного календаря
        flatpickr("#datePicker", {
            locale: "uk",
            dateFormat: "d.m.Y", // Формат: 25.11.2026
            minDate: "today",    // Блокуємо минулі дні
            disableMobile: "true" // Примусово включаємо красивий дизайн замість браузерного
        });

        // Налаштування стильного годинника
        flatpickr("#timePicker", {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            time_24hr: true,
            disableMobile: "true",
            minuteIncrement: 15 // Крок вибору хвилин (наприклад, 10:00, 10:15)
        });

        document.getElementById('submit-btn').addEventListener('click', () => {
            let date = document.getElementById('datePicker').value;
            let time = document.getElementById('timePicker').value;
            
            if(!date || !time) {
                tg.showAlert("Будь ласка, оберіть і дату, і час!");
                return;
            }

            tg.sendData(JSON.stringify({ date: date, time: time })); 
        });
    </script>
</body>
</html>
